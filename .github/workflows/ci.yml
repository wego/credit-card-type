name: "Unit Tests"

on: [push]

jobs:
  build:
    name: "Unit Tests on Ubuntu"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 #v2 tag
      - name: Use Node.js
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e #v1 tag
        with:
          node-version: "14.x"
      - run: npm install
      - run: npm test

